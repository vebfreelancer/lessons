<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="wrapper">
        <header class="header">
            <div class="header__container">
                <h1>Animation</h1>
            </div>
        </header>
        <main class="page">
            <div class="road">
                <div class="track">
                    <div class="track-marcup"></div>
                    <div class="car">
                        <div class="car--frame frame">
                            <div class="frame--body">
                                <div class="frame--window"></div>
                                <div class="frame--door"></div>
                                <div class="frame--door-hands"></div>
                                <div class="frame--mirror"></div>
                            </div>
                        </div>
                        <div class="car--body body">
                            <div class="body--engine"></div>
                            <div class="body--rear-light"></div>
                            <div class="body--front-light"></div>
                            <div class="body-petrol"></div>
                        </div>
                        <div class="car--bottom-tuning bottom-tuning"></div>
                        <div class="car-tires tires">
                            <div class="tires--tire-underwing"></div>
                            <div class="tires--front-underwing"></div>
                            <div class="tires--rear-tire tire-mask">
                                <div class="tire">
                                    <div class="tire--disc">
                                        <div class="tire--screws">
                                            <span class="tire--screw"></span>
                                            <span class="tire--screw"></span>
                                            <span class="tire--screw"></span>
                                            <span class="tire--screw"></span>
                                        </div>
                                    </div>
                                    <div class="tire--axis"></div>
                                </div>
                            </div>
                            <div class="tires--front-tire tire-mask">
                                <div class="tire">
                                    <div class="tire--disc">
                                        <div class="tire--screws">
                                            <div class="tire--screw"></div>
                                            <div class="tire--screw"></div>
                                            <div class="tire--screw"></div>
                                            <div class="tire--screw"></div>
                                        </div>
                                    </div>
                                    <div class="tire--axis"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <footer class="footer">
            <div class="footer__container">
                <div class="footer__text">
                    &copy; All rights reserved
                </div>
            </div>
        </footer>
    </div>
</body>
</html>
